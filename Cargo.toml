[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace]
members = ["crates/*", "dnas/*/zomes/coordinator/*", "dnas/*/zomes/integrity/*"]
resolver = "2"

[workspace.dependencies]
# Pinned exactly, not floated. Moss 0.15 bundles holochain-v0.6.1, and a later
# 0.6.x HDK emits an import for a host function that conductor does not have
# ("unknown import __hc__get_init_properties_1", at applet load). The DNA tests
# cannot catch this: holonix main-0.6 ships conductor 0.6.3, which does provide
# it, so the wasm passes there and fails in Moss. Raise these only together
# with the conductor Moss actually ships.
hdi = { version = "=0.7.1" }
hdk = { version = "=0.6.1" }
holochain_serialized_bytes = "0.0.57"
serde = "1"

[workspace.dependencies.ark]
path = "dnas/ark/zomes/coordinator/ark"

[workspace.dependencies.ark_integrity]
path = "dnas/ark/zomes/integrity/ark"

[workspace.dependencies.ark_pick]
path = "crates/pick"

[workspace.dependencies.file_storage]
path = "dnas/ark/zomes/coordinator/file_storage"

[workspace.dependencies.file_storage_integrity]
path = "dnas/ark/zomes/integrity/file_storage"
